tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: 'Register a new user in the app'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'Dmytro Boyko'
          email:
            description: "User's email"
            type: string
            example: 'dmytro3@example.com'
          password:
            description: "User's password"
            type: string
            example: '$2b$10$btAA1dNr/J.Z91kWEtn5T.m7Op9oNU9a8jn.9M/Zo7RnpghW9XTQe'
responses:
  '201':
    description: 'Successfully registered a user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully registered a user!'
            data:
              type: object
              $ref: ../../components/schemas/user.yaml
  '409':
    $ref: '../../components/responses/409.yaml'
