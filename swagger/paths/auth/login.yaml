tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Authenticate a user with email and password'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: 'dmytro3@example.com'
          password:
            description: "User's password"
            type: string
            example: '$2b$10$btAA1dNr/J.Z91kWEtn5T.m7Op9oNU9a8jn.9M/Zo7RnpghW9XTQe'
responses:
  '200':
    description: 'User successfully logged in'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in a user!'
            data:
              type: object
              required:
                - accesToken
              properties:
                accesToken:
                  type: string
                  example: 'wGNV1xXOKTILFDIxEhg9WA62vBxt/S5KZgATrCLx'
  '401':
    description: Unauthorized (Email not found or incorrect password)
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Email not found or unauthorized'
  '404':
    description: NotFoundError (user not found)
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'User not found'
