tags:
  - Contacts
summary: Update contact
operationId: patchContact
description: 'Update a contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '67193a14adee2a2e0550fa3f'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Dmytro Boyko'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380000000002'
          email:
            description: "Contact's email"
            type: string
            example: 'dmytro3@example.com'
          isFavourite:
            description: 'IsFavourite or not for the contact'
            type: boolean
            example: false
          contactType:
            description: 'Type of contact'
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Link to the contact's photo"
            type: string
            format: binary
            example: 'https://res.cloudinary.com/uqwgdu/image/upload/image.png'
responses:
  '200':
    description: 'Contact updated successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
